<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homework Control</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main class="container">
    <header>
        <h1>Homework Control</h1>
    </header>

    <section aria-labelledby="sign-in-heading">
        <h2 id="sign-in-heading">Welcome back</h2>
        <form id="login-form">
            <label>
                <span>Username</span>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </label>
            <label>
                <span>Password</span>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Continue</button>
        </form>
    </section>

    <section aria-labelledby="session-heading">
        <div class="section-heading">
            <div>
                <span class="eyebrow">Session</span>
                <h2 id="session-heading">Account</h2>
            </div>
            <button id="logout-button" class="button-quiet" type="button">Log out</button>
        </div>
        <div class="session-details">
            <span id="session-username">****</span>
            <span id="session-role">****</span>
            <span id="token-lifetime"></span>
        </div>
    </section>

    <section aria-labelledby="assignments-heading">
        <div class="section-heading">
            <div>
                <span class="eyebrow">Workspace</span>
                <h2 id="assignments-heading">Assignments</h2>
            </div>
            <button id="read-all-button" class="button-quiet" type="button">Refresh</button>
        </div>
        <form id="create-assignment-form">
            <label>
                <span>Business key</span>
                <input id="business-key" name="businessKey" type="text" required>
            </label>
            <label>
                <span>Title</span>
                <input id="assignment-title" name="title" type="text" maxlength="120" required>
            </label>
            <button type="submit">Add assignment</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th scope="col">Key</th>
                    <th scope="col">Title</th>
                    <th scope="col">Status</th>
                    <th id="locked-action-heading" scope="col">Locked action</th>
                </tr>
                </thead>
                <tbody id="assignments-body"></tbody>
            </table>
        </div>
    </section>

    <section aria-labelledby="last-response-heading">
        <span class="eyebrow" id="last-response-heading">Activity</span>
        <pre id="last-response">Nothing called yet.</pre>
    </section>
</main>
</body>
</html>
