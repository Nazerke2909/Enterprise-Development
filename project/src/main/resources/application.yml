spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/css
    username: ${DB_USERNAME:css}
    password: ${DB_PASSWORD:css}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
app:
  cli:
    enabled: false